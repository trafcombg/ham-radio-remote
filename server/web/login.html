<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>HAM Radio Remote — Вход</title>
<style>
  body { font-family: sans-serif; background: #1b1f24; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #262b33; padding: 2rem; border-radius: 8px; width: 280px; }
  h1 { font-size: 1.1rem; margin-top: 0; }
  input { width: 100%; box-sizing: border-box; padding: .5rem; margin-bottom: .75rem; border-radius: 4px; border: 1px solid #444; background: #1b1f24; color: #eee; }
  button { width: 100%; padding: .6rem; border: none; border-radius: 4px; background: #3b82f6; color: white; cursor: pointer; }
  #error { color: #f87171; font-size: .9rem; min-height: 1.2em; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>Admin вход — HAM Radio Remote</h1>
  <input id="username" placeholder="Потребител" autocomplete="username">
  <input id="password" type="password" placeholder="Парола" autocomplete="current-password">
  <div id="error"></div>
  <button type="submit">Вход</button>
</form>
<script>
(async () => {
  const res = await fetch("/api/setup-status");
  const status = await res.json();
  if (status.needs_setup) { location.href = "/setup"; return; }
  if (!status.db_configured) {
    document.getElementById("error").textContent =
      "PostgreSQL не е конфигуриран (server/config.json, db.dsn) — admin панелът е недостъпен.";
  }
})();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password }),
  });
  if (res.ok) {
    location.href = "/";
  } else {
    const body = await res.json().catch(() => ({}));
    document.getElementById("error").textContent = body.detail || "грешка при вход";
  }
});
</script>
</body>
</html>
