<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>HAM Radio Remote — Admin</title>
<style>
  body { font-family: sans-serif; background: #1b1f24; color: #eee; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.3rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #333; }
  button { padding: .4rem .8rem; border: none; border-radius: 4px; background: #3b82f6; color: white; cursor: pointer; margin-right: .3rem; }
  button.danger { background: #ef4444; }
  button.secondary { background: #4b5563; }
  .busy { color: #f59e0b; }
  .free { color: #34d399; }
  tr.inactive { opacity: .45; }
  .lvl-wrap { width: 70px; height: 8px; background: #333; border-radius: 3px; overflow: hidden; margin-bottom: 2px; }
  .lvl-fill { height: 100%; width: 0%; background: #34d399; }
  .lvl-fill.out { background: #3b82f6; }
  dialog { background: #262b33; color: #eee; border: none; border-radius: 8px; width: 440px; max-width: 90vw; padding: 1.5rem; }
  dialog label { display: block; margin-top: .6rem; font-size: .85rem; color: #aaa; }
  dialog input, dialog select { width: 100%; box-sizing: border-box; padding: .4rem; border-radius: 4px; border: 1px solid #444; background: #1b1f24; color: #eee; margin-top: .2rem; }
  #testResult { min-height: 1.2em; font-size: .85rem; margin-top: .5rem; }
  .row { display: flex; gap: .5rem; }
  .row > div { flex: 1; }
  #updateBanner { display: none; background: #1e3a5f; border: 1px solid #3b82f6; border-radius: 6px; padding: .7rem 1rem; margin-bottom: 1rem; align-items: center; justify-content: space-between; gap: 1rem; }
</style>
</head>
<body>
<h1>HAM Radio Remote — Admin панел <small id="versionLabel" style="font-size:.6em; color:#888;"></small></h1>
<div id="updateBanner">
  <span id="updateText"></span>
  <button id="updateApplyBtn">Инсталирай и рестартирай сървъра</button>
</div>
<button id="addBtn">+ Добави радио</button>
<button id="checkUpdateBtn" class="secondary">Провери за ъпдейт</button>
<button id="debugBtn" class="secondary">Debug режим: ...</button>
<button id="logoutBtn" class="secondary">Изход</button>
<table id="radioTable">
  <thead><tr><th>Активно</th><th>Име</th><th>Модел</th><th>CAT</th><th>PTT</th><th>Статус</th><th>Аудио Вх/Изх</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<dialog id="editDialog">
  <h2 id="dialogTitle">Радио</h2>
  <form id="editForm">
    <label><input name="active" type="checkbox" style="width:auto; display:inline-block;" checked> Активно (сървърът го ползва)</label>
    <label>Име<input name="name" required></label>
    <label>Модел<input name="model"></label>
    <label>Открито CAT устройство
      <select id="catDeviceSelect"><option value="">— Ръчно въвеждане по-долу —</option></select>
    </label>
    <div class="row">
      <div><label>CAT сериен порт<input name="serial_port" placeholder="COM5 (или празно, ако ползваш VID:PID)"></label></div>
      <div><label>Baud<input name="baud" type="number" value="19200"></label></div>
    </div>
    <div class="row">
      <div><label>VID (hex)<input name="vid" placeholder="напр. 10C4"></label></div>
      <div><label>PID (hex)<input name="pid" placeholder="напр. EA60"></label></div>
    </div>
    <label>Сериен номер (по избор, при съвпадащи VID:PID)<input name="serial_number"></label>
    <input type="hidden" name="location">
    <div class="row">
      <div><label>CAT TCP порт<input name="tcp_port" type="number" required></label></div>
      <div><label>Control порт<input name="control_port" type="number" required></label></div>
    </div>
    <label>Открито аудио устройство (вход/микрофон)
      <select id="audioInputDeviceSelect"><option value="">— Ръчно въвеждане по-долу —</option></select>
    </label>
    <label>Вход (микрофон, име съдържа)<input name="audio_input_name_contains" placeholder="напр. Microphone"></label>
    <input type="hidden" name="audio_input_endpoint_id">
    <label>Открито аудио устройство (изход/говорител)
      <select id="audioOutputDeviceSelect"><option value="">— Ръчно въвеждане по-долу —</option></select>
    </label>
    <label>Изход (говорител, име съдържа)<input name="audio_output_name_contains" placeholder="напр. Speakers"></label>
    <input type="hidden" name="audio_output_endpoint_id">
    <label>Аудио UDP порт<input name="audio_udp_port" type="number" required></label>
    <div class="row">
      <div><label>Вход (микрофон/радио→сървър) сила
        <input name="audio_input_gain" type="range" min="0" max="2" step="0.01" value="1.0" oninput="audio_input_gain_out.value = audio_input_gain.value">
        <output id="audio_input_gain_out">1.0</output>
      </label></div>
      <div><label>Изход (сървър→радио) сила
        <input name="audio_output_gain" type="range" min="0" max="2" step="0.01" value="1.0" oninput="audio_output_gain_out.value = audio_output_gain.value">
        <output id="audio_output_gain_out">1.0</output>
      </label></div>
    </div>
    <label>PTT метод
      <select name="ptt_method">
        <option value="civ">CAT команда (CI-V)</option>
        <option value="rts">RTS линия</option>
        <option value="dtr">DTR линия</option>
      </select>
    </label>
    <label>CI-V адрес (десетично, напр. 148 за 0x94)<input name="civ_address" type="number"></label>
    <label>PTT сериен порт override (празно = същия като CAT)<input name="ptt_serial_port"></label>
    <label>CW UDP порт<input name="cw_udp_port" type="number" required></label>
    <label>CW метод (празно = същия като PTT — обичайно за CW-способни радиа)
      <select name="cw_method">
        <option value="">(същия като PTT)</option>
        <option value="civ">CAT команда (CI-V)</option>
        <option value="rts">RTS линия</option>
        <option value="dtr">DTR линия</option>
      </select>
    </label>
    <label>CW сериен порт override (празно = същия като CAT)<input name="cw_serial_port"></label>
    <div id="testResult"></div>
    <div style="margin-top:1rem; display:flex; gap:.5rem;">
      <button type="button" id="testBtn" class="secondary">Провери връзка</button>
      <button type="submit">Запази</button>
      <button type="button" id="cancelBtn" class="secondary">Отказ</button>
    </div>
  </form>
</dialog>

<h1>Усилватели (ACOM)</h1>
<button id="addAmpBtn">+ Добави усилвател</button>
<table id="ampTable">
  <thead><tr><th>Име</th><th>Модел</th><th>Транспорт</th><th>Статус</th><th>Мощност/SWR/Темп</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<h1>Потребители</h1>
<button id="addUserBtn">+ Добави потребител</button>
<table id="userTable">
  <thead><tr><th>Потребител</th><th>Admin</th><th>Радиа</th><th>Усилватели</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<dialog id="userDialog">
  <h2 id="userDialogTitle">Потребител</h2>
  <form id="userForm">
    <label>Потребителско име<input name="username" required></label>
    <label>Парола<input name="password" type="password" placeholder="остави празно, за да не се променя (при редакция)"></label>
    <label><input name="is_admin" type="checkbox" style="width:auto; display:inline-block;"> Admin (пълен достъп до всичко)</label>
    <label>Радиа с достъп</label>
    <div id="userRadioChecks"></div>
    <label>Усилватели с достъп</label>
    <div id="userAmpChecks"></div>
    <div style="margin-top:1rem; display:flex; gap:.5rem;">
      <button type="submit">Запази</button>
      <button type="button" id="userCancelBtn" class="secondary">Отказ</button>
    </div>
  </form>
</dialog>

<dialog id="ampDialog">
  <h2 id="ampDialogTitle">Усилвател</h2>
  <form id="ampForm">
    <label>Име<input name="name" required></label>
    <label>Модел
      <select name="model">
        <option>500S</option><option>600S</option><option>700S</option>
        <option selected>1200S</option><option>2020S</option>
      </select>
    </label>
    <label>Транспорт
      <select name="transport">
        <option value="tcp">TCP (суров, през eBox IP — недоказано, пробвай първо)</option>
        <option value="serial">Сериен порт (директно, без eBox)</option>
        <option value="http">HTTP (eBox уеб — Operate/Standby/Power готови, телеметрия частична — виж server/ebox_transport.py)</option>
      </select>
    </label>
    <div class="row">
      <div><label>Host/IP (за tcp/http)<input name="host"></label></div>
      <div><label>Порт (за tcp/http)<input name="port" type="number"></label></div>
    </div>
    <label>Сериен порт (за serial транспорт)<input name="serial_port" placeholder="COM7"></label>
    <div class="row">
      <div><label>Потребител (ако eBox изисква)<input name="username"></label></div>
      <div><label>Парола<input name="password" type="password"></label></div>
    </div>
    <label>Свързано радио (празно = споделен, без CAT mirror/PTT lockout)<input name="linked_radio" placeholder="напр. IC-7300"></label>
    <div style="margin-top:1rem; display:flex; gap:.5rem;">
      <button type="submit">Запази</button>
      <button type="button" id="ampCancelBtn" class="secondary">Отказ</button>
    </div>
  </form>
</dialog>

<script>
let radios = [];

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
  if (res.status === 401) { location.href = "/login"; throw new Error("unauthorized"); }
  return res;
}

async function loadRadios() {
  const res = await api("/api/radios");
  const body = await res.json();
  radios = body.radios;
  renderTable();
}

function renderTable() {
  const tbody = document.querySelector("#radioTable tbody");
  tbody.innerHTML = "";
  for (const r of radios) {
    const tr = document.createElement("tr");
    const busy = r.status && r.status.busy_by;
    const catLabel = r.cat.serial_port || (r.cat.vid != null ? r.cat.vid.toString(16) + ":" + r.cat.pid.toString(16) : "?");
    if (r.active === false) tr.className = "inactive";
    tr.innerHTML = `
      <td>${r.active === false ? "не" : "да"}</td>
      <td>${r.name}</td>
      <td>${r.model || ""}</td>
      <td>${catLabel}</td>
      <td>${r.ptt.method}</td>
      <td class="${busy ? "busy" : "free"}">${busy ? "заето от " + busy : "свободно"}</td>
      <td>
        <div class="lvl-wrap"><div class="lvl-fill" id="lvl-in-${CSS.escape(r.name)}"></div></div>
        <div class="lvl-wrap"><div class="lvl-fill out" id="lvl-out-${CSS.escape(r.name)}"></div></div>
      </td>
      <td></td>`;
    const actionsTd = tr.lastElementChild;
    const editBtn = document.createElement("button");
    editBtn.textContent = "Редактирай";
    editBtn.className = "secondary";
    editBtn.onclick = () => openEdit(r);
    const delBtn = document.createElement("button");
    delBtn.textContent = "Изтрий";
    delBtn.className = "danger";
    delBtn.onclick = () => deleteRadio(r.name);
    actionsTd.append(editBtn, delBtn);
    tbody.appendChild(tr);
  }
}

async function pollLevels() {
  try {
    const res = await api("/api/radios/levels");
    const levels = await res.json();
    for (const [name, lv] of Object.entries(levels)) {
      const inEl = document.getElementById(`lvl-in-${CSS.escape(name)}`);
      const outEl = document.getElementById(`lvl-out-${CSS.escape(name)}`);
      if (inEl) inEl.style.width = Math.min(100, lv.input / 200 * 100) + "%";
      if (outEl) outEl.style.width = Math.min(100, lv.output / 200 * 100) + "%";
    }
  } catch (e) { /* transient — next poll retries */ }
}

const dialog = document.getElementById("editDialog");
const form = document.getElementById("editForm");
let editingOriginalName = null;

const catDeviceSelect = document.getElementById("catDeviceSelect");
const audioInputDeviceSelect = document.getElementById("audioInputDeviceSelect");
const audioOutputDeviceSelect = document.getElementById("audioOutputDeviceSelect");
let scannedDevices = { serial: [], audio: [] };

async function loadDeviceOptions() {
  const res = await api("/api/devices");
  scannedDevices = await res.json();

  catDeviceSelect.innerHTML = '<option value="">— Ръчно въвеждане по-долу —</option>';
  scannedDevices.serial.forEach((d, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    const vidpid = d.vid != null ? `${d.vid.toString(16)}:${d.pid.toString(16)}` : "?";
    opt.textContent = `${d.port} — ${vidpid}${d.serial_number ? " SN:" + d.serial_number : ""}`;
    catDeviceSelect.appendChild(opt);
  });

  for (const select of [audioInputDeviceSelect, audioOutputDeviceSelect]) {
    select.innerHTML = '<option value="">— Ръчно въвеждане по-долу —</option>';
    scannedDevices.audio.forEach((d, i) => {
      if (!d.endpoint_id) return;
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `[${d.index}] ${d.name}`;
      select.appendChild(opt);
    });
  }
}

catDeviceSelect.onchange = () => {
  if (catDeviceSelect.value === "") return;
  const d = scannedDevices.serial[parseInt(catDeviceSelect.value)];
  form.serial_port.value = d.port;
  form.vid.value = d.vid != null ? d.vid.toString(16) : "";
  form.pid.value = d.pid != null ? d.pid.toString(16) : "";
  form.serial_number.value = d.serial_number || "";
  form.location.value = d.location || "";
};

function syncGainOutputs() {
  audio_input_gain_out.value = form.audio_input_gain.value;
  audio_output_gain_out.value = form.audio_output_gain.value;
}

audioInputDeviceSelect.onchange = () => {
  if (audioInputDeviceSelect.value === "") return;
  const d = scannedDevices.audio[parseInt(audioInputDeviceSelect.value)];
  form.audio_input_name_contains.value = d.name;
  form.audio_input_endpoint_id.value = d.endpoint_id || "";
  if (d.volume != null) {
    form.audio_input_gain.value = d.volume;
    syncGainOutputs();
  }
};

audioOutputDeviceSelect.onchange = () => {
  if (audioOutputDeviceSelect.value === "") return;
  const d = scannedDevices.audio[parseInt(audioOutputDeviceSelect.value)];
  form.audio_output_name_contains.value = d.name;
  form.audio_output_endpoint_id.value = d.endpoint_id || "";
  if (d.volume != null) {
    form.audio_output_gain.value = d.volume;
    syncGainOutputs();
  }
};

async function openEdit(r) {
  editingOriginalName = r ? r.name : null;
  document.getElementById("dialogTitle").textContent = r ? "Редактирай " + r.name : "Ново радио";
  document.getElementById("testResult").textContent = "";
  form.reset();
  await loadDeviceOptions();
  if (r) {
    form.active.checked = r.active !== false;
    form.name.value = r.name;
    form.model.value = r.model || "";
    form.serial_port.value = r.cat.serial_port || "";
    form.baud.value = r.cat.baud;
    form.vid.value = r.cat.vid != null ? r.cat.vid.toString(16) : "";
    form.pid.value = r.cat.pid != null ? r.cat.pid.toString(16) : "";
    form.serial_number.value = r.cat.serial_number || "";
    form.location.value = r.cat.location || "";
    form.tcp_port.value = r.cat.tcp_port;
    form.control_port.value = r.control_port;
    form.audio_input_name_contains.value = r.audio.input_name_contains || "";
    form.audio_input_endpoint_id.value = r.audio.input_endpoint_id || "";
    form.audio_output_name_contains.value = r.audio.output_name_contains || "";
    form.audio_output_endpoint_id.value = r.audio.output_endpoint_id || "";
    form.audio_udp_port.value = r.audio.udp_port;
    form.audio_input_gain.value = r.audio.input_gain != null ? r.audio.input_gain : 1.0;
    form.audio_output_gain.value = r.audio.output_gain != null ? r.audio.output_gain : 1.0;
    syncGainOutputs();
    form.ptt_method.value = r.ptt.method;
    form.civ_address.value = r.ptt.civ_address || "";
    form.ptt_serial_port.value = r.ptt.serial_port || "";
    form.cw_udp_port.value = r.cw_udp_port;
    form.cw_method.value = r.cw ? r.cw.method : "";
    form.cw_serial_port.value = r.cw ? (r.cw.serial_port || "") : "";
  }
  dialog.showModal();
}

document.getElementById("addBtn").onclick = () => openEdit(null);
document.getElementById("cancelBtn").onclick = () => dialog.close();

function formToCfg() {
  const f = new FormData(form);
  return {
    name: f.get("name"),
    model: f.get("model") || f.get("name"),
    active: f.get("active") === "on",
    cat: {
      serial_port: f.get("serial_port") || null,
      vid: f.get("vid") ? parseInt(f.get("vid"), 16) : null,
      pid: f.get("pid") ? parseInt(f.get("pid"), 16) : null,
      serial_number: f.get("serial_number") || null,
      location: f.get("location") || null,
      baud: parseInt(f.get("baud")) || 19200,
      tcp_port: parseInt(f.get("tcp_port")),
    },
    control_port: parseInt(f.get("control_port")),
    audio: {
      input_name_contains: f.get("audio_input_name_contains") || null,
      input_endpoint_id: f.get("audio_input_endpoint_id") || null,
      output_name_contains: f.get("audio_output_name_contains") || null,
      output_endpoint_id: f.get("audio_output_endpoint_id") || null,
      udp_port: parseInt(f.get("audio_udp_port")),
      input_gain: parseFloat(f.get("audio_input_gain")) || 1.0,
      output_gain: parseFloat(f.get("audio_output_gain")) || 1.0,
    },
    cw_udp_port: parseInt(f.get("cw_udp_port")),
    ptt: {
      method: f.get("ptt_method"),
      civ_address: f.get("civ_address") ? parseInt(f.get("civ_address")) : null,
      serial_port: f.get("ptt_serial_port") || null,
    },
    cw: f.get("cw_method") ? {
      method: f.get("cw_method"),
      civ_address: f.get("civ_address") ? parseInt(f.get("civ_address")) : null,
      serial_port: f.get("cw_serial_port") || null,
    } : null,
  };
}

document.getElementById("testBtn").onclick = async () => {
  const cfg = formToCfg();
  const name = editingOriginalName || cfg.name;
  const el = document.getElementById("testResult");
  el.textContent = "Проверка...";
  el.style.color = "#aaa";
  const res = await api(`/api/radios/${encodeURIComponent(name)}/test`, {
    method: "POST",
    body: JSON.stringify({ cat: cfg.cat }),
  });
  const body = await res.json();
  el.textContent = body.ok ? "✓ Радиото отговори" : "✗ Няма отговор" + (body.error ? ": " + body.error : "");
  el.style.color = body.ok ? "#34d399" : "#f87171";
};

form.onsubmit = async (e) => {
  e.preventDefault();
  await saveRadio(false);
};

async function saveRadio(force) {
  const cfg = formToCfg();
  cfg.force = force;
  const isNew = !editingOriginalName;
  const url = isNew ? "/api/radios" : `/api/radios/${encodeURIComponent(editingOriginalName)}`;
  const method = isNew ? "POST" : "PUT";
  const res = await api(url, { method, body: JSON.stringify(cfg) });
  if (res.status === 409) {
    const body = await res.json();
    if (confirm(`Радиото е заето от ${body.detail.busy_by}. Продължи и прекъсни връзката?`)) {
      await saveRadio(true);
    }
    return;
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    alert("Грешка: " + JSON.stringify(body.detail || res.status));
    return;
  }
  dialog.close();
  loadRadios();
}

async function deleteRadio(name, force) {
  if (!force && !confirm(`Изтриване на ${name}?`)) return;
  const res = await api(`/api/radios/${encodeURIComponent(name)}?force=${force ? "true" : "false"}`, { method: "DELETE" });
  if (res.status === 409) {
    const body = await res.json();
    if (confirm(`Радиото е заето от ${body.detail.busy_by}. Продължи?`)) {
      await deleteRadio(name, true);
    }
    return;
  }
  loadRadios();
}

document.getElementById("logoutBtn").onclick = async () => {
  await api("/api/logout", { method: "POST" });
  location.href = "/login";
};

let amplifiers = [];
const ampDialog = document.getElementById("ampDialog");
const ampForm = document.getElementById("ampForm");
let editingAmpName = null;

async function loadAmplifiers() {
  const res = await api("/api/amplifiers");
  const body = await res.json();
  amplifiers = body.amplifiers;
  renderAmpTable();
}

function renderAmpTable() {
  const tbody = document.querySelector("#ampTable tbody");
  tbody.innerHTML = "";
  for (const a of amplifiers) {
    const t = a.telemetry;
    const statusText = t ? t.status : "—";
    const measurements = t ? `${t.output_power_w}W / SWR ${t.swr} / ${t.temp_c}°C` : "—";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.name}</td>
      <td>${a.model}</td>
      <td>${a.transport}</td>
      <td class="${t && t.fault ? 'busy' : 'free'}">${statusText}</td>
      <td>${measurements}</td>
      <td></td>`;
    const actionsTd = tr.lastElementChild;
    for (const [label, mode] of [["Operate", "operate"], ["Standby", "standby"], ["Off", "off"]]) {
      const btn = document.createElement("button");
      btn.textContent = label;
      btn.className = "secondary";
      btn.onclick = () => setAmpMode(a.name, mode);
      actionsTd.appendChild(btn);
    }
    const editBtn = document.createElement("button");
    editBtn.textContent = "Редактирай";
    editBtn.className = "secondary";
    editBtn.onclick = () => openAmpEdit(a);
    const delBtn = document.createElement("button");
    delBtn.textContent = "Изтрий";
    delBtn.className = "danger";
    delBtn.onclick = () => deleteAmplifier(a.name);
    actionsTd.append(editBtn, delBtn);
    tbody.appendChild(tr);
  }
}

async function setAmpMode(name, mode) {
  const res = await api(`/api/amplifiers/${encodeURIComponent(name)}/mode`, {
    method: "POST",
    body: JSON.stringify({ mode }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    alert("Грешка: " + (body.detail || res.status));
  }
}

function openAmpEdit(a) {
  editingAmpName = a ? a.name : null;
  document.getElementById("ampDialogTitle").textContent = a ? "Редактирай " + a.name : "Нов усилвател";
  ampForm.reset();
  if (a) {
    ampForm.name.value = a.name;
    ampForm.model.value = a.model;
    ampForm.transport.value = a.transport;
    ampForm.host.value = a.host || "";
    ampForm.port.value = a.port || "";
    ampForm.serial_port.value = a.serial_port || "";
    ampForm.username.value = a.username || "";
    ampForm.linked_radio.value = a.linked_radio || "";
  }
  ampDialog.showModal();
}

document.getElementById("addAmpBtn").onclick = () => openAmpEdit(null);
document.getElementById("ampCancelBtn").onclick = () => ampDialog.close();

ampForm.onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(ampForm);
  const cfg = {
    name: f.get("name"),
    model: f.get("model"),
    transport: f.get("transport"),
    host: f.get("host") || null,
    port: f.get("port") ? parseInt(f.get("port")) : null,
    serial_port: f.get("serial_port") || null,
    username: f.get("username") || null,
    password: f.get("password") || null,
    linked_radio: f.get("linked_radio") || null,
  };
  const isNew = !editingAmpName;
  const url = isNew ? "/api/amplifiers" : `/api/amplifiers/${encodeURIComponent(editingAmpName)}`;
  const res = await api(url, { method: isNew ? "POST" : "PUT", body: JSON.stringify(cfg) });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    alert("Грешка: " + JSON.stringify(body.detail || res.status));
    return;
  }
  ampDialog.close();
  loadAmplifiers();
};

async function deleteAmplifier(name) {
  if (!confirm(`Изтриване на ${name}?`)) return;
  await api(`/api/amplifiers/${encodeURIComponent(name)}`, { method: "DELETE" });
  loadAmplifiers();
}

let users = [];
const userDialog = document.getElementById("userDialog");
const userForm = document.getElementById("userForm");
let editingUsername = null;

async function loadUsers() {
  const res = await api("/api/users");
  const body = await res.json();
  users = body.users;
  renderUserTable();
}

function renderUserTable() {
  const tbody = document.querySelector("#userTable tbody");
  tbody.innerHTML = "";
  for (const u of users) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.username}</td>
      <td>${u.is_admin ? "да" : "не"}</td>
      <td>${u.is_admin ? "всички" : (u.radios.join(", ") || "—")}</td>
      <td>${u.is_admin ? "всички" : (u.amplifiers.join(", ") || "—")}</td>
      <td></td>`;
    const actionsTd = tr.lastElementChild;
    const editBtn = document.createElement("button");
    editBtn.textContent = "Редактирай";
    editBtn.className = "secondary";
    editBtn.onclick = () => openUserEdit(u);
    const delBtn = document.createElement("button");
    delBtn.textContent = "Изтрий";
    delBtn.className = "danger";
    delBtn.onclick = () => deleteUser(u.username);
    actionsTd.append(editBtn, delBtn);
    tbody.appendChild(tr);
  }
}

function _buildAccessChecks(containerId, names, checkedNames) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  for (const name of names) {
    const label = document.createElement("label");
    label.style.cssText = "display:inline-block; width:auto; margin-right: .8rem;";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = name;
    cb.style.width = "auto";
    cb.checked = checkedNames.includes(name);
    label.append(cb, " " + name);
    container.appendChild(label);
  }
}

function openUserEdit(u) {
  editingUsername = u ? u.username : null;
  document.getElementById("userDialogTitle").textContent = u ? "Редактирай " + u.username : "Нов потребител";
  userForm.reset();
  _buildAccessChecks("userRadioChecks", radios.map(r => r.name), u ? u.radios : []);
  _buildAccessChecks("userAmpChecks", amplifiers.map(a => a.name), u ? u.amplifiers : []);
  if (u) {
    userForm.username.value = u.username;
    userForm.is_admin.checked = u.is_admin;
  }
  userDialog.showModal();
}

document.getElementById("addUserBtn").onclick = () => openUserEdit(null);
document.getElementById("userCancelBtn").onclick = () => userDialog.close();

userForm.onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(userForm);
  const checkedValues = (containerId) =>
    Array.from(document.querySelectorAll(`#${containerId} input:checked`)).map(cb => cb.value);
  const cfg = {
    username: f.get("username"),
    password: f.get("password") || null,
    is_admin: f.get("is_admin") === "on",
    radios: checkedValues("userRadioChecks"),
    amplifiers: checkedValues("userAmpChecks"),
  };
  const isNew = !editingUsername;
  if (isNew && !cfg.password) {
    alert("Паролата е задължителна за нов потребител.");
    return;
  }
  const url = isNew ? "/api/users" : `/api/users/${encodeURIComponent(editingUsername)}`;
  const res = await api(url, { method: isNew ? "POST" : "PUT", body: JSON.stringify(cfg) });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    alert("Грешка: " + JSON.stringify(body.detail || res.status));
    return;
  }
  userDialog.close();
  loadUsers();
};

async function deleteUser(username) {
  if (!confirm(`Изтриване на ${username}?`)) return;
  await api(`/api/users/${encodeURIComponent(username)}`, { method: "DELETE" });
  loadUsers();
}

async function refreshDebugBtn() {
  const res = await api("/api/debug");
  const body = await res.json();
  document.getElementById("debugBtn").textContent = `Debug режим: ${body.enabled ? "вкл." : "изкл."}`;
}

document.getElementById("debugBtn").onclick = async () => {
  const btn = document.getElementById("debugBtn");
  const currentlyOn = btn.textContent.includes("вкл.");
  await api("/api/debug", { method: "POST", body: JSON.stringify({ enabled: !currentlyOn }) });
  refreshDebugBtn();
};

async function checkForUpdate() {
  const res = await api("/api/update");
  const body = await res.json();
  document.getElementById("versionLabel").textContent = `v${body.current_version}`;
  const banner = document.getElementById("updateBanner");
  if (body.pending) {
    document.getElementById("updateText").textContent =
      `Налична е версия ${body.pending.version} (текуща ${body.current_version}) — изтеглена, готова за инсталиране.`;
    banner.style.display = "flex";
  } else {
    banner.style.display = "none";
  }
}

document.getElementById("checkUpdateBtn").onclick = async () => {
  const btn = document.getElementById("checkUpdateBtn");
  btn.disabled = true;
  btn.textContent = "Проверка...";
  try {
    await api("/api/update/check", { method: "POST" });
    await checkForUpdate();
  } finally {
    btn.disabled = false;
    btn.textContent = "Провери за ъпдейт";
  }
};

document.getElementById("updateApplyBtn").onclick = async () => {
  if (!confirm("Сървърът ще спре, ще инсталира новата версия и трябва да го стартираш ръчно отново. Всички активни радио/аудио връзки ще прекъснат. Продължи?")) return;
  await api("/api/update/apply", { method: "POST" });
  document.getElementById("updateText").textContent = "Сървърът се обновява и спира — стартирай го ръчно, когато инсталацията приключи.";
  document.getElementById("updateApplyBtn").disabled = true;
};

(async () => {
  const meRes = await fetch("/api/me");
  const me = await meRes.json();
  if (!me.user || !me.user.is_admin) { location.href = "/login"; return; }
  loadRadios();
  loadAmplifiers();
  loadUsers();
  checkForUpdate();
  refreshDebugBtn();
  setInterval(checkForUpdate, 5 * 60 * 1000);
  setInterval(pollLevels, 300);
})();
</script>
</body>
</html>
