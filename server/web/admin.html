<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>HAM Radio Remote — Admin</title>
<style>
  body { font-family: sans-serif; background: #1b1f24; color: #eee; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.3rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #333; }
  button { padding: .4rem .8rem; border: none; border-radius: 4px; background: #3b82f6; color: white; cursor: pointer; margin-right: .3rem; }
  button.danger { background: #ef4444; }
  button.secondary { background: #4b5563; }
  .busy { color: #f59e0b; }
  .free { color: #34d399; }
  dialog { background: #262b33; color: #eee; border: none; border-radius: 8px; width: 440px; max-width: 90vw; padding: 1.5rem; }
  dialog label { display: block; margin-top: .6rem; font-size: .85rem; color: #aaa; }
  dialog input, dialog select { width: 100%; box-sizing: border-box; padding: .4rem; border-radius: 4px; border: 1px solid #444; background: #1b1f24; color: #eee; margin-top: .2rem; }
  #testResult { min-height: 1.2em; font-size: .85rem; margin-top: .5rem; }
  .row { display: flex; gap: .5rem; }
  .row > div { flex: 1; }
</style>
</head>
<body>
<h1>HAM Radio Remote — Admin панел</h1>
<button id="addBtn">+ Добави радио</button>
<button id="logoutBtn" class="secondary">Изход</button>
<table id="radioTable">
  <thead><tr><th>Име</th><th>Модел</th><th>CAT</th><th>PTT</th><th>Статус</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<dialog id="editDialog">
  <h2 id="dialogTitle">Радио</h2>
  <form id="editForm">
    <label>Име<input name="name" required></label>
    <label>Модел<input name="model"></label>
    <div class="row">
      <div><label>CAT сериен порт<input name="serial_port" placeholder="COM5 (или празно, ако ползваш VID:PID)"></label></div>
      <div><label>Baud<input name="baud" type="number" value="19200"></label></div>
    </div>
    <div class="row">
      <div><label>VID (hex)<input name="vid" placeholder="напр. 10C4"></label></div>
      <div><label>PID (hex)<input name="pid" placeholder="напр. EA60"></label></div>
    </div>
    <label>Сериен номер (по избор, при съвпадащи VID:PID)<input name="serial_number"></label>
    <div class="row">
      <div><label>CAT TCP порт<input name="tcp_port" type="number" required></label></div>
      <div><label>Control порт<input name="control_port" type="number" required></label></div>
    </div>
    <label>Аудио устройство (име съдържа)<input name="audio_name_contains" placeholder="напр. USB Audio CODEC"></label>
    <label>Аудио UDP порт<input name="audio_udp_port" type="number" required></label>
    <label>PTT метод
      <select name="ptt_method">
        <option value="civ">CAT команда (CI-V)</option>
        <option value="rts">RTS линия</option>
        <option value="dtr">DTR линия</option>
      </select>
    </label>
    <label>CI-V адрес (десетично, напр. 148 за 0x94)<input name="civ_address" type="number"></label>
    <label>PTT сериен порт override (празно = същия като CAT)<input name="ptt_serial_port"></label>
    <label>CW UDP порт<input name="cw_udp_port" type="number" required></label>
    <label>CW метод (празно = същия като PTT — обичайно за CW-способни радиа)
      <select name="cw_method">
        <option value="">(същия като PTT)</option>
        <option value="civ">CAT команда (CI-V)</option>
        <option value="rts">RTS линия</option>
        <option value="dtr">DTR линия</option>
      </select>
    </label>
    <label>CW сериен порт override (празно = същия като CAT)<input name="cw_serial_port"></label>
    <div id="testResult"></div>
    <div style="margin-top:1rem; display:flex; gap:.5rem;">
      <button type="button" id="testBtn" class="secondary">Провери връзка</button>
      <button type="submit">Запази</button>
      <button type="button" id="cancelBtn" class="secondary">Отказ</button>
    </div>
  </form>
</dialog>

<script>
let radios = [];

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
  if (res.status === 401) { location.href = "/login"; throw new Error("unauthorized"); }
  return res;
}

async function loadRadios() {
  const res = await api("/api/radios");
  const body = await res.json();
  radios = body.radios;
  renderTable();
}

function renderTable() {
  const tbody = document.querySelector("#radioTable tbody");
  tbody.innerHTML = "";
  for (const r of radios) {
    const tr = document.createElement("tr");
    const busy = r.status && r.status.busy_by;
    const catLabel = r.cat.serial_port || (r.cat.vid != null ? r.cat.vid.toString(16) + ":" + r.cat.pid.toString(16) : "?");
    tr.innerHTML = `
      <td>${r.name}</td>
      <td>${r.model || ""}</td>
      <td>${catLabel}</td>
      <td>${r.ptt.method}</td>
      <td class="${busy ? "busy" : "free"}">${busy ? "заето от " + busy : "свободно"}</td>
      <td></td>`;
    const actionsTd = tr.lastElementChild;
    const editBtn = document.createElement("button");
    editBtn.textContent = "Редактирай";
    editBtn.className = "secondary";
    editBtn.onclick = () => openEdit(r);
    const delBtn = document.createElement("button");
    delBtn.textContent = "Изтрий";
    delBtn.className = "danger";
    delBtn.onclick = () => deleteRadio(r.name);
    actionsTd.append(editBtn, delBtn);
    tbody.appendChild(tr);
  }
}

const dialog = document.getElementById("editDialog");
const form = document.getElementById("editForm");
let editingOriginalName = null;

function openEdit(r) {
  editingOriginalName = r ? r.name : null;
  document.getElementById("dialogTitle").textContent = r ? "Редактирай " + r.name : "Ново радио";
  document.getElementById("testResult").textContent = "";
  form.reset();
  if (r) {
    form.name.value = r.name;
    form.model.value = r.model || "";
    form.serial_port.value = r.cat.serial_port || "";
    form.baud.value = r.cat.baud;
    form.vid.value = r.cat.vid != null ? r.cat.vid.toString(16) : "";
    form.pid.value = r.cat.pid != null ? r.cat.pid.toString(16) : "";
    form.serial_number.value = r.cat.serial_number || "";
    form.tcp_port.value = r.cat.tcp_port;
    form.control_port.value = r.control_port;
    form.audio_name_contains.value = r.audio.name_contains || "";
    form.audio_udp_port.value = r.audio.udp_port;
    form.ptt_method.value = r.ptt.method;
    form.civ_address.value = r.ptt.civ_address || "";
    form.ptt_serial_port.value = r.ptt.serial_port || "";
    form.cw_udp_port.value = r.cw_udp_port;
    form.cw_method.value = r.cw ? r.cw.method : "";
    form.cw_serial_port.value = r.cw ? (r.cw.serial_port || "") : "";
  }
  dialog.showModal();
}

document.getElementById("addBtn").onclick = () => openEdit(null);
document.getElementById("cancelBtn").onclick = () => dialog.close();

function formToCfg() {
  const f = new FormData(form);
  return {
    name: f.get("name"),
    model: f.get("model") || f.get("name"),
    cat: {
      serial_port: f.get("serial_port") || null,
      vid: f.get("vid") ? parseInt(f.get("vid"), 16) : null,
      pid: f.get("pid") ? parseInt(f.get("pid"), 16) : null,
      serial_number: f.get("serial_number") || null,
      location: null,
      baud: parseInt(f.get("baud")) || 19200,
      tcp_port: parseInt(f.get("tcp_port")),
    },
    control_port: parseInt(f.get("control_port")),
    audio: {
      name_contains: f.get("audio_name_contains") || null,
      endpoint_id: null,
      udp_port: parseInt(f.get("audio_udp_port")),
    },
    cw_udp_port: parseInt(f.get("cw_udp_port")),
    ptt: {
      method: f.get("ptt_method"),
      civ_address: f.get("civ_address") ? parseInt(f.get("civ_address")) : null,
      serial_port: f.get("ptt_serial_port") || null,
    },
    cw: f.get("cw_method") ? {
      method: f.get("cw_method"),
      civ_address: f.get("civ_address") ? parseInt(f.get("civ_address")) : null,
      serial_port: f.get("cw_serial_port") || null,
    } : null,
  };
}

document.getElementById("testBtn").onclick = async () => {
  const cfg = formToCfg();
  const name = editingOriginalName || cfg.name;
  const el = document.getElementById("testResult");
  el.textContent = "Проверка...";
  el.style.color = "#aaa";
  const res = await api(`/api/radios/${encodeURIComponent(name)}/test`, {
    method: "POST",
    body: JSON.stringify({ cat: cfg.cat }),
  });
  const body = await res.json();
  el.textContent = body.ok ? "✓ Радиото отговори" : "✗ Няма отговор" + (body.error ? ": " + body.error : "");
  el.style.color = body.ok ? "#34d399" : "#f87171";
};

form.onsubmit = async (e) => {
  e.preventDefault();
  await saveRadio(false);
};

async function saveRadio(force) {
  const cfg = formToCfg();
  cfg.force = force;
  const isNew = !editingOriginalName;
  const url = isNew ? "/api/radios" : `/api/radios/${encodeURIComponent(editingOriginalName)}`;
  const method = isNew ? "POST" : "PUT";
  const res = await api(url, { method, body: JSON.stringify(cfg) });
  if (res.status === 409) {
    const body = await res.json();
    if (confirm(`Радиото е заето от ${body.detail.busy_by}. Продължи и прекъсни връзката?`)) {
      await saveRadio(true);
    }
    return;
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    alert("Грешка: " + JSON.stringify(body.detail || res.status));
    return;
  }
  dialog.close();
  loadRadios();
}

async function deleteRadio(name, force) {
  if (!force && !confirm(`Изтриване на ${name}?`)) return;
  const res = await api(`/api/radios/${encodeURIComponent(name)}?force=${force ? "true" : "false"}`, { method: "DELETE" });
  if (res.status === 409) {
    const body = await res.json();
    if (confirm(`Радиото е заето от ${body.detail.busy_by}. Продължи?`)) {
      await deleteRadio(name, true);
    }
    return;
  }
  loadRadios();
}

document.getElementById("logoutBtn").onclick = async () => {
  await api("/api/logout", { method: "POST" });
  location.href = "/login";
};

(async () => {
  const meRes = await fetch("/api/me");
  const me = await meRes.json();
  if (!me.user || !me.user.is_admin) { location.href = "/login"; return; }
  loadRadios();
})();
</script>
</body>
</html>
